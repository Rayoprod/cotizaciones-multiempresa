<div class="flex h-full min-h-full overflow-hidden relative surface-ground w-full">

  <!-- Backdrop para móvil -->
  <div *ngIf="sidebarAbierto"
       class="md:hidden fixed inset-0 bg-black-alpha-60 z-layout-backdrop backdrop-blur"
       (click)="cerrarMenu()"
       aria-hidden="true">
  </div>

  <!-- Sidebar Admin Principal -->
  <aside class="mobile-sidebar-drawer fixed md:static top-0 left-0 bottom-0 z-layout-sidebar h-full shadow-4 flex flex-column select-none"
         style="width: 18.5rem; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); color: #f8fafc;"
         [class.open]="sidebarAbierto"
         [class.closed]="!sidebarAbierto">

    <!-- Header Sidebar Admin -->
    <div class="sidebar-top-header flex align-items-center justify-content-between gap-3 flex-shrink-0">
      <div class="flex align-items-center gap-3 overflow-hidden flex-1">
        <div class="w-2.5rem h-2.5rem border-circle flex align-items-center justify-content-center shadow-2 flex-shrink-0"
             style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff;">
          <i class="pi pi-shield text-xl"></i>
        </div>
        <div class="flex flex-column overflow-hidden">
          <span class="font-bold text-base text-white text-overflow-ellipsis overflow-hidden white-space-nowrap">
            Consola Admin
          </span>
          <span class="text-xs text-sky-400 font-semibold tracking-wider uppercase mt-1">
            Supervisión Global
          </span>
        </div>
      </div>
      <button pButton type="button" icon="pi pi-times" [text]="true" [rounded]="true"
              class="p-button-text p-button-rounded text-white-alpha-70 hover:text-white hover:bg-white-alpha-10 flex-shrink-0 cursor-pointer"
              style="min-width: 44px; min-height: 44px; touch-action: manipulation;"
              (click)="cerrarMenu()" aria-label="Cerrar menú"></button>
    </div>

    <!-- Navegación Menú Admin -->
    <div class="flex-1 min-h-0 app-scroll-container p-3">
      <div class="mb-3 px-2" style="color: rgba(255,255,255,0.45); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;">
        Módulos de Gestión
      </div>

      <div class="flex flex-column gap-2">
        <a *ngFor="let item of navItemsFiltrados" [routerLink]="item.path"
           routerLinkActive="bg-white-alpha-15 text-white font-bold shadow-2 border-left-3 border-sky-400"
           [routerLinkActiveOptions]="{ exact: false }"
           style="min-height: 48px; touch-action: manipulation;"
           (click)="cerrarMenu()"
           class="no-underline flex align-items-center gap-3 px-3 py-3 border-round-xl transition-all transition-duration-200 text-white-alpha-80 hover:bg-white-alpha-10 hover:text-white cursor-pointer">
          <div class="flex align-items-center justify-content-center border-round-lg w-2rem h-2rem bg-sky-500-alpha-20 text-sky-400">
            <i [class]="item.icon + ' text-base'"></i>
          </div>
          <span>{{ item.label }}</span>
        </a>

        <p-divider styleClass="border-white-alpha-10 my-2"></p-divider>

        <div class="mb-2 px-2" style="color: rgba(255,255,255,0.45); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;">
          Acceso Rápido
        </div>

        <button pButton type="button" icon="pi pi-shopping-bag" label="Operar / Cotizar"
                severity="info" class="w-full justify-content-start border-round-xl py-3 px-3 text-white font-bold cursor-pointer"
                style="min-height: 48px; touch-action: manipulation;"
                (click)="operarEmpresa()">
        </button>
      </div>
    </div>

    <!-- Perfil Admin & Logout -->
    <div class="p-3 mt-auto flex-shrink-0" style="border-top: 1px solid rgba(255,255,255,0.08); padding-bottom: max(0.75rem, calc(0.75rem + var(--sab)));">
      <div class="flex align-items-center gap-3 mb-3 p-3 border-round-xl" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.05);">
        <p-avatar icon="pi pi-shield" shape="circle" [style]="{ background: '#0284c7', color: '#ffffff' }"></p-avatar>
        <div class="flex flex-column overflow-hidden flex-1">
          <span class="font-bold text-sm text-white flex align-items-center gap-2">
            {{ esAdminGeneral ? 'Super Admin' : 'Admin Empresa' }}
          </span>
          <span class="white-space-nowrap overflow-hidden text-overflow-ellipsis text-xs text-white-alpha-70 mt-1">
            {{ usuarioNombre }}
          </span>
        </div>
      </div>
      <button pButton type="button" icon="pi pi-sign-out" label="Cerrar sesión"
              severity="danger" class="w-full border-round-xl cursor-pointer"
              style="min-height: 44px; touch-action: manipulation;"
              (click)="logout()">
      </button>
    </div>

  </aside>

  <!-- Contenedor Principal Admin (Top Header + Outlet) -->
  <div class="flex-1 flex flex-column min-w-0 min-h-0 overflow-hidden z-1 h-full">

    <!-- Top Header Bar Executive Admin -->
    <header class="pwa-top-header flex align-items-center justify-content-between px-3 md:px-4 z-2 flex-shrink-0">
      <div class="flex align-items-center gap-3">
        <button pButton type="button" icon="pi pi-bars" [text]="true" [rounded]="true"
                class="p-button-text p-button-rounded text-white text-xl hover:bg-white-alpha-15 transition-all flex align-items-center justify-content-center border-none cursor-pointer"
                style="min-width: 44px; min-height: 44px; touch-action: manipulation;"
                (click)="toggleSidebar()"
                [attr.aria-expanded]="sidebarAbierto"
                aria-label="Menú principal"></button>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-white m-0 tracking-tight flex align-items-center gap-2">
            <i class="pi pi-shield-check text-sky-400 hidden sm:inline-block"></i>
            {{ tituloPagina }}
          </h1>
          <span class="text-xs text-sky-200 font-medium hidden md:inline-block">Consola de Control Multi-Empresa & RLS Security</span>
        </div>
      </div>

      <div class="flex align-items-center gap-3">
        <button *ngIf="pwaUpdate.updateAvailable()" pButton type="button" icon="pi pi-refresh" label="Actualizar App"
                severity="primary" size="small" class="font-bold text-xs border-round-lg shadow-2 px-3 animate-pulse"
                [pTooltip]="'Una nueva versión está lista. Haz clic para actualizar.'"
                tooltipPosition="bottom"
                (click)="reloadPwaApp()"></button>
        <button *ngIf="pwaUpdate.canInstallPwa()" pButton type="button" icon="pi pi-download" label="Instalar App"
                severity="success" size="small" class="font-bold text-xs border-round-lg shadow-2 px-3"
                (click)="instalarPwa()"></button>
        <p-tag value="RLS Activo" severity="success" styleClass="font-bold text-xs px-2 py-1 border-round-md hidden sm:inline-flex"></p-tag>
        <p-tag value="Super Admin" severity="danger" styleClass="font-bold text-xs px-2 py-1 border-round-md"></p-tag>
        <p-button icon="pi pi-external-link" label="Modo Operación" severity="secondary" [outlined]="true" size="small"
                  styleClass="border-round-lg font-bold text-white border-white-alpha-40 hidden md:inline-flex" (onClick)="operarEmpresa()"></p-button>
      </div>
    </header>

    <!-- Main Content Outlet -->
    <main class="flex-1 layout-router-outlet app-scroll-container p-2 md:p-4" style="background: #f8fafc;">
      <div *ngIf="cargandoAdmin" class="flex flex-column align-items-center justify-content-center h-full gap-3">
        <p-progressSpinner strokeWidth="4" [style]="{ width: '50px', height: '50px' }"></p-progressSpinner>
        <p class="text-500 font-medium text-sm m-0">Sincronizando datos administrativos...</p>
      </div>
      <router-outlet *ngIf="!cargandoAdmin"></router-outlet>
    </main>

  </div>

  <p-toast></p-toast>
  <p-toast key="pwa-update-toast" position="bottom-center" (onClose)="reloadPwaApp()"></p-toast>

</div>
